<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout-container">

        <aside class="sidebar">
            <h2 class="titulo1">Painel</h2>
            <nav class="nav">
                <a href="#" class="link">Início</a>
                <a href="#" class="link">Configurações</a>
                <a href="#" class="link">Sair</a>
            </nav>
        </aside>

        <main class="tudo">

            <header class="barratopo">
                <h1 class="titbarratopo">Visão Geral</h1>
                <button class="botaobarra">Novo Projeto</button>
            </header>

            <div class="pagina">

                <nav class="menuhorizon">
                    <a href="#" class="linkhorizon">Visão Geral</a>
                    <a href="#" class="linkhorizon1">Análises</a>
                    <a href="#" class="linkhorizon1">Relatórios</a>
                </nav>

                <section class="bloco">
                    <h2 class="titulo2">Estatísticas</h2>
                    <div class="grade">
                        <div class="card">Cartão 1</div>
                        <div class="card">Cartão 2</div>
                        <div class="card">Cartão 3</div>
                        <div class="card">Cartão 4</div>
                    </div>
                </section>

                <section class="bloco">
                    <h2 class="titulo2">Avisos Importantes</h2>
                    <div class="alertagrade">
                        <div class="alertacard alertaalerta">
                            <p class="alertatitulo">Aviso 1</p>
                            <p class="alertatexto">O sistema ficará indisponível nesta madrugada.</p>
                        </div>
                        <div class="alertacard alertaperigo">
                            <p class="alertatitulo">Aviso 2</p>
                            <p class="alertatexto">Atualize sua senha de acesso imediatamente.</p>
                        </div>
                    </div>
                </section>

            </div>
        </main>
    </div>

</body>
</html>
